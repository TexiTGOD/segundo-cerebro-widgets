*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#f4f1ea;-webkit-font-smoothing:antialiased}
.card{position:relative;height:100vh;min-height:150px;border-radius:14px;overflow:hidden;background:#141a26;display:flex;flex-direction:column;justify-content:center;padding:18px 22px}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 110%,rgba(92,150,210,.55),transparent 60%),radial-gradient(110% 90% at 105% 105%,rgba(226,160,92,.45),transparent 60%);pointer-events:none}
.card>*{position:relative}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,234,.6);font-weight:600}
.big{font-family:'Unb',sans-serif;font-weight:600;letter-spacing:.02em;line-height:1}

.row{display:flex;align-items:center;gap:18px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{font:600 12px/1 inherit;font-family:inherit;color:rgba(244,241,234,.75);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;cursor:pointer}
.tab.on{background:#f0b06a;color:#1a1410;border-color:#f0b06a}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{font:600 13px/1 inherit;font-family:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.go{background:linear-gradient(135deg,#8fc0ee,#5c96d2);color:#0e1522}
.ghost{background:rgba(255,255,255,.1);color:#f4f1ea}
.info{font-size:12px;color:rgba(244,241,234,.7);margin-top:4px}
</style></head><body><div class="card">
<div class="tabs"><button class="tab on" data-min="25" data-k="Foco">Foco 25</button><button class="tab" data-min="5" data-k="Pausa">Pausa 5</button><button class="tab" data-min="15" data-k="Pausa larga">Pausa 15</button></div>
<div class="row"><div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="45" stroke="rgba(255,255,255,.12)" stroke-width="8" fill="none"/><circle id="arc" cx="52" cy="52" r="45" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="0"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fc0ee"/><stop offset="1" stop-color="#f0b06a"/></linearGradient></defs></svg><div class="t big" id="t">25:00</div></div>
<div><div class="label" id="mode">Foco</div><div class="info" id="info">Hoy: 0 pomodoros</div>
<div class="btns"><button class="btn go" id="go">Empezar</button><button class="btn ghost" id="rs">Reiniciar</button></div></div></div>
</div><script>
const C=282.7;let total=25*60,left=total,run=false,timer=null,mode='Foco';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const today=new Date().toDateString();let done=store.get('pomo-day')===today?+(store.get('pomo-n')||0):0;
function info(){document.getElementById('info').textContent='Hoy: '+done+(done===1?' pomodoro':' pomodoros');}
function draw(){const mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');document.getElementById('t').textContent=mm+':'+ss;document.getElementById('arc').setAttribute('stroke-dashoffset',(C*(1-left/total)).toFixed(1));}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(s=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,a.currentTime+s);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+s+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+s+.25);o.start(a.currentTime+s);o.stop(a.currentTime+s+.3);});}catch(e){}}
function set(min,k){clearInterval(timer);run=false;document.getElementById('go').textContent='Empezar';total=min*60;left=total;mode=k;document.getElementById('mode').textContent=k;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>set(+b.dataset.min,b.dataset.k));
document.getElementById('go').onclick=()=>{if(run){clearInterval(timer);run=false;document.getElementById('go').textContent='Seguir';return;}run=true;document.getElementById('go').textContent='Pausa';
timer=setInterval(()=>{left--;draw();if(left<=0){clearInterval(timer);run=false;beep();if(mode==='Foco'){done++;store.set('pomo-day',today);store.set('pomo-n',done);info();set(done%4===0?15:5,done%4===0?'Pausa larga':'Pausa');}else set(25,'Foco');}},1000);};
document.getElementById('rs').onclick=()=>set(total/60,mode);
info();draw();
</script></body></html>
