*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#141a26;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#f4f1ea;-webkit-font-smoothing:antialiased}
.card{position:relative;height:100vh;min-height:0;border-radius:0;overflow:hidden;background:#141a26;display:flex;flex-direction:column;justify-content:center;padding:12px 20px}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 0% 110%,rgba(92,150,210,.55),transparent 60%),radial-gradient(110% 90% at 105% 105%,rgba(226,160,92,.45),transparent 60%);pointer-events:none}
.card>*{position:relative}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,234,.6);font-weight:600}
.big{font-family:'Unb',sans-serif;font-weight:600;letter-spacing:.02em;line-height:1}

.time{font-size:clamp(32px,11vw,48px);margin:4px 0 4px}
.colon{display:inline-block;animation:b 2s steps(1) infinite}@keyframes b{50%{opacity:.35}}
.date{font-size:13px;color:rgba(244,241,234,.85)}
.bar{margin-top:10px;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#8fc0ee,#f0b06a);width:0}
.foot{margin-top:6px;font-size:11px;color:rgba(244,241,234,.6)}
</style></head><body><div class="card">
<div class="label" id="greet">Hola</div>
<div class="big time"><span id="h">--</span><span class="colon">:</span><span id="m">--</span></div>
<div class="date" id="date"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="foot" id="foot"></div>
</div><script>
function tick(){const d=new Date();const h=d.getHours(),m=d.getMinutes();
document.getElementById('h').textContent=String(h).padStart(2,'0');document.getElementById('m').textContent=String(m).padStart(2,'0');
const ds=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});document.getElementById('date').textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
document.getElementById('greet').textContent=h<6?'Buenas noches':h<13?'Buen día':h<20?'Buenas tardes':'Buenas noches';
const p=(h*60+m)/1440*100;document.getElementById('fill').style.width=p.toFixed(1)+'%';
document.getElementById('foot').textContent='Ya pasó el '+Math.round(p)+' % del día';}
tick();setInterval(tick,1000);
</script></body></html>
